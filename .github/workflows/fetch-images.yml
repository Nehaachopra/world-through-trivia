name: Fetch trivia images

on:
  push:
    paths:
      - "trivia/*.csv"
      - "scripts/fetch_images.py"
      - ".github/workflows/fetch-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download freely licensed images from Wikimedia Commons
        run: |
          for f in $(grep -l "image_search_query" trivia/*.csv); do
            echo "== $f"
            python scripts/fetch_images.py "$f"
          done
      - name: Commit images and credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add images trivia
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Fetch trivia images from Wikimedia Commons"
            git push
          fi
